<!-- 技术栈区 -->
<section id="tech-stack" class="py-20 px-4 md:px-8 bg-apple-lightgray">
    <div class="container mx-auto">
        <h2 class="text-3xl md:text-4xl font-bold mb-16 text-center reveal-element">技术栈</h2>
        
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            {% for skill in tech_stack %}
            <div class="text-center card-hover bg-apple-card-gradient rounded-xl p-6 reveal-element" data-sr-delay="{{ loop.index0 * 100 }}">
                <div class="w-16 h-16 bg-apple-hover rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="{{ skill.icon }} text-2xl text-apple-white"></i>
                </div>
                <h3 class="font-semibold mb-2">{{ skill.name }}</h3>
                <p class="text-apple-gray text-sm mb-2">{{ skill.description }}</p>
                <div class="flex justify-center mb-2">
                    {% if skill.level == "熟练" %}
                    <span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">熟练</span>
                    {% elif skill.level == "熟悉" %}
                    <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">熟悉</span>
                    {% else %}
                    <span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-xs">{{ skill.level }}</span>
                    {% endif %}
                </div>
                <p class="text-apple-gray text-xs">{{ skill.experience }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
