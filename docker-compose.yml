version: '3.8'

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ltw-website
    ports:
      - "8080:82"
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=ltw"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:82/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
